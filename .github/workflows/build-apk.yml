
name: Build Rill Habits APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP tidak ditemukan."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Locate Android project
        run: |
          BUILD_FILE="$(find project -maxdepth 4 -type f -name build.gradle -not -path '*/app/*' -print -quit)"
          test -n "$BUILD_FILE"
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create missing launcher icon
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          cat > "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#2E7D32"
                  android:pathData="M0,0h48v48h-48z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,24l8,8 16,-17 -3,-3 -13,14 -5,-5z" />
          </vector>
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rill-Habits-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
